# Blueprint en la raíz del monorepo.
# El código de la API vive en e-commerce-fastapi/
services:
  - type: web
    name: torque-api
    runtime: python
    plan: free
    rootDir: e-commerce-fastapi
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        fromDatabase:
          name: torque-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: PROJECT_NAME
        value: E-Commerce API
      - key: API_V1_PREFIX
        value: /api/v1
      # Orígenes CORS: Vite local + dominios Vercel. Ej: http://localhost:5173,https://landingecommerce.vercel.app,*
      - key: CORS_ORIGINS
        sync: false
      # Supabase Storage (para python -m app.upload_images en Shell)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: repuestos
      # Wompi Sandbox (Dashboard → Desarrolladores → Llaves y secretos)
      - key: WOMPI_PUBLIC_KEY
        sync: false
      - key: WOMPI_PRIVATE_KEY
        sync: false
      - key: WOMPI_EVENTS_SECRET
        sync: false
      - key: WOMPI_INTEGRITY_SECRET
        sync: false

databases:
  - name: torque-db
    plan: free
    databaseName: torque
    user: torque
